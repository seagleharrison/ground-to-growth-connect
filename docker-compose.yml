services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: locvault
      POSTGRES_PASSWORD: locvault_dev
      POSTGRES_DB: locvault
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U locvault -d locvault"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
